<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Game</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #0a5d2a;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        #game-container {
            position: relative;
            width: 720px;
            height: 420px;
            background: #2e8b57;
            border: 8px solid #114422;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        #field {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #3f9f57 0%, #2e8b57 100%);
        }
        .line {
            position: absolute;
            background: rgba(255,255,255,0.8);
        }
        #center-line {
            top: 0;
            left: 50%;
            width: 4px;
            height: 100%;
            transform: translateX(-50%);
        }
        #center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100px;
            height: 100px;
            border: 4px solid rgba(255,255,255,0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        #goal-left, #goal-right {
            position: absolute;
            top: 160px;
            width: 10px;
            height: 100px;
            background: rgba(255,255,255,0.9);
        }
        #goal-left { left: 0; }
        #goal-right { right: 0; }
        #ball {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff 0%, #fff 40%, #000 45%, #000 100%);
            transition: transform 0.05s linear;
        }
        #player {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #ffdd33;
            box-shadow: 0 0 10px rgba(255,221,51,0.7);
        }
        #scoreboard {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 16px;
        }
        #instructions {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }
    </style>
</head>
<body>

</body>
</html>
