<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        audio {
            width: 100%;
            margin-bottom: 20px;
            outline: none;
        }
        .playlist {
            margin-top: 30px;
        }
        .playlist h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }
        .song-item {
            padding: 10px 15px;
            margin-bottom: 10px;
            background: #f5f5f5;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .song-item:hover {
            background: #e0e0e0;
        }
        .song-item.active {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Music Player</h1>
        <audio id="player" controls>
            Your browser does not support the audio element.
        </audio>
        
        <div class="playlist">
            <h2>Playlist</h2>
            <div class="song-item active" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
                Sample Song 1
            </div>
            <div class="song-item" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">
                Sample Song 2
            </div>
            <div class="song-item" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3">
                Sample Song 3
            </div>
        </div>
    </div>

    <script>
        const player = document.getElementById('player');
        const songItems = document.querySelectorAll('.song-item');

        songItems.forEach(item => {
            item.addEventListener('click', function() {
                const src = this.getAttribute('data-src');
                player.src = src;
                player.play();

                songItems.forEach(song => song.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Load first song on page load
        player.src = songItems[0].getAttribute('data-src');
    </script>
</body>
</html>
