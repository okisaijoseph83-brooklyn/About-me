<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>ScoleX — logo</title>
	<style>
		body {
			margin: 0;
			height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #0f1724;
			color: #e6eef8;
			font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
		}
		.logo-wrap { display:flex; gap:16px; align-items:center }
		.mark { width:96px; height:96px }
		.wordmark { font-weight:700; letter-spacing:0.6px; font-size:40px }
		.accent { color:#00d1ff }
		/* subtle glow */
		.mark svg { filter: drop-shadow(0 8px 20px rgba(0,209,255,0.08)); }
	</style>
</head>
<body>
	<div class="logo-wrap">
		<!-- Geometric tech mark: interlocking S + hexagon -->
		<div class="mark" aria-hidden="true">
			<svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
				<defs>
					<linearGradient id="g" x1="0" x2="1">
						<stop offset="0" stop-color="#00d1ff" />
						<stop offset="1" stop-color="#5b7cff" />
					</linearGradient>
					<filter id="f" x="-20%" y="-20%" width="140%" height="140%">
						<feGaussianBlur stdDeviation="6" result="b" />
						<feMerge><feMergeNode in="b"/></feMerge>
					</filter>
				</defs>
				<!-- hexagon background -->
				<g transform="translate(100,100)">
					<path d="M0-80 L69-40 L69 40 L0 80 L-69 40 L-69 -40 Z" fill="url(#g)" opacity="0.12"/>
					<!-- stylized S composed of two rounded shapes -->
					<path d="M-36 -36 C-10 -62, 30 -62, 56 -36 C76 -16, 76 16, 56 36 C30 62, -10 62, -36 36 C-56 16, -56 -16, -36 -36 Z"
								fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
					<!-- inner cut for tech feel -->
					<path d="M-10 -18 C10 -34, 36 -34, 46 -18" fill="none" stroke="#0f1724" stroke-width="10" stroke-linecap="round" />
				</g>
			</svg>
		</div>
		<div class="wordmark">
			<span class="accent">s</span>colex
		</div>
	</div>
</body>
</html>
